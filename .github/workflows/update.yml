name: Update the API description

on:
  schedule:
    # Daily: a release of InfraNest reaches this repository within a day.
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The description, the Postman collection and environment, the Bruno collection and the lint ruleset, as the
      # developer site publishes them. Writes `changed` and release notes when anything differs.
      - name: Fetch what the developer site publishes
        id: fetch
        run: python3 scripts/update.py

      # The same lint the CI workflow runs: a description that fails it is not committed or released.
      - name: Lint the description
        if: steps.fetch.outputs.changed == 'true'
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint openapi.json --ruleset .spectral.yaml --fail-severity=warn

      - name: Commit and release
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.fetch.outputs.notes }}
        run: |
          tag="v$(date -u +%Y.%m.%d)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then tag="$tag.$(date -u +%H%M)"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json postman bruno .spectral.yaml
          git commit -m "The API description and collections as published on $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
          (cd bruno && zip -qr ../infranest.bruno.zip . -x '.*')
          gh release create "$tag" openapi.json postman/infranest.postman_collection.json \
            postman/infranest.postman_environment.json infranest.bruno.zip \
            --target main --title "$tag" --notes "$NOTES"
